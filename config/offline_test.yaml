data_source:
  mode: offline
  offline:
    dataset_path: dataset/mt_offline/20260529_113904/data
    read_image_nums: 800
    parse_timestamp: false
  online:
    camera_id: "0"
    camera_width: 1280
    camera_height: 720
    camera_brightness: 100
    robot_ip: "192.168.1.20"
    robot_port: 30004
    robot_login_name: "aubo"
    robot_password: "123456"
    sync_tolerance_ms: 50.0

data_reader:
  queue_config:
    maxsize: 10
    drop_oldest: false
    put_timeout: 0.2

infer:
  engine_path: checkpoint/best.engine
  class_names:
    - object
  num_keypoints: 7
  conf_threshold: 0.25
  iou_threshold: 0.45
  queue_config:
    maxsize: 10
    drop_oldest: false
    put_timeout: 0.2

refine:
  max_workers: 4
  num_keypoints: 7
  queue_config:
    maxsize: 10
    drop_oldest: false
    put_timeout: 0.2

