data_source:
  mode: online
  offline:
    dataset_path: dataset/mt_offline/20260529_113904/data
    read_image_nums: 800
    parse_timestamp: false
  online:
    camera_id: 0
    camera_width: 1920
    camera_height: 1080
    camera_brightness: 100
    robot_ip: "192.168.217.124"
    robot_port: 30004
    robot_login_name: "aubo"
    robot_password: "123456"
    sync_tolerance_ms: 20.0

data_reader:
  queue_config:
    maxsize: 10
    drop_oldest: true
